name: Build and push to build branch.

on:
    push:
        branches: [trunk]

permissions: {}

# Queue rather than cancel, so a push to the build branch is never interrupted.
concurrency:
    group: build-trunk
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # Push the built theme.
        env:
            DIST_REF: build

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  package-manager-cache: false

            # Restore only: the production build never writes the cache, the lint workflow does.
            - name: Restore node_modules
              id: node-modules
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      source/wp-content/themes/wporg-developer-2023/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

            - name: Install dependencies
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Build
              run: npm run build

            - name: Trim the repo down to just the theme
              run: |
                  rm -rf source/wp-content/themes/wporg-developer-2023/node_modules
                  rm -rf source/wp-content/themes/wporg-developer-2023/scss
                  mv source/wp-content/themes/wporg-developer-2023 "$RUNNER_TEMP"
                  # Moving is much faster than deleting, and the runner is discarded anyway.
                  mv node_modules "$RUNNER_TEMP"
                  git rm -rfq .
                  rm -rf -- *
                  mv "$RUNNER_TEMP"/wporg-developer-2023/* .

            - name: Add all the theme files
              run: git add --force -- *

            - name: Append build number to version
              run: |
                  current_version=$(grep -oP 'Version: \K[0-9]+\.[0-9]+\.[0-9]+' style.css)
                  new_version="${current_version}-${GITHUB_SHA::7}"
                  sed -i "s/Version: $current_version/Version: $new_version/" style.css
                  git add style.css

            # The token is only exposed here, so the dependencies run during the build can't read it.
            - name: Commit and push
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git commit --quiet --message "Build: $GITHUB_SHA"
                  git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DIST_REF"
