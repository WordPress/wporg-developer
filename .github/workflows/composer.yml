name: Composer

# Checks that the development environment's dependencies still resolve and
# install. Nothing else in CI uses them, so this only runs when they change.
on:
    push:
        branches: [trunk]
        paths:
            - composer.json
            - .github/workflows/composer.yml
    pull_request:
        paths:
            - composer.json
            - .github/workflows/composer.yml

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    install:
        name: Install dependencies

        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # Check out the code.

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Some packages are checked out from meta.svn.wordpress.org.
            - name: Install SVN
              run: sudo apt-get update && sudo apt-get install -y subversion

            - name: Install dependencies
              run: composer install --no-interaction --no-progress
