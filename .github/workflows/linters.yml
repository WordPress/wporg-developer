name: Static Analysis (Linting)

# This workflow is triggered on pushes to trunk, and any PRs.
on:
    push:
        branches: [trunk]
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Lint everything

        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # Check out the code.

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Checkout wporg-repo-tools
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: WordPress/wporg-repo-tools
                  path: vendor/wporg/wporg-repo-tools
                  persist-credentials: false

            - name: Install NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  package-manager-cache: false

            - name: Cache node_modules
              id: node-modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      source/wp-content/themes/wporg-developer-2023/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

            - name: Install dependencies
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            - name: Setup configs
              run: TEXTDOMAIN=wporg bash vendor/wporg/wporg-repo-tools/bin/update-configs

            - name: Lint CSS
              run: npm run lint:css --workspace=wporg-developer-2023

            - name: Lint JS
              run: npm run lint:js --workspace=wporg-developer-2023
