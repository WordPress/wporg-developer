name: Static Analysis (Linting)

# This workflow is triggered on pushes to trunk, and any PRs.
on:
    push:
        branches: [trunk]
    pull_request:

jobs:
    check:
        name: Lint everything

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - name: Install NodeJS
              uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version-file: '.nvmrc'

            - name: Checkout wporg-repo-tools
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  repository: WordPress/wporg-repo-tools
                  path: vendor/wporg/wporg-repo-tools

            - name: Cache node_modules
              id: node-modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      source/wp-content/themes/wporg-developer-2023/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'source/wp-content/themes/wporg-developer-2023/package.json') }}

            - name: Install dependencies
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: yarn

            - name: Setup configs
              run: TEXTDOMAIN=wporg bash vendor/wporg/wporg-repo-tools/bin/update-configs

            - name: Lint CSS
              run: |
                  yarn workspace wporg-developer-2023 lint:css
            - name: Lint JS
              run: |
                  yarn workspace wporg-developer-2023 lint:js
